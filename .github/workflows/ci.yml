name: ci

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -U pip
          pip install -e ".[dev]"
      - name: Lint
        run: |
          . .venv/bin/activate
          ruff check app tests
      - name: Test
        env:
          AUTH_DISABLED_FOR_TESTS: "true"
          ENVIRONMENT: development
        run: |
          . .venv/bin/activate
          pytest -q

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-tower
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/control-tower/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
