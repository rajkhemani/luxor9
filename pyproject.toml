[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "luxor9"
version = "0.1.0"
description = "LUXOR9 — unified agent orchestration platform (core engine, agents, MCP layer, API)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "LUXOR9" }]
keywords = ["agents", "orchestration", "mcp", "llm", "fastapi"]

dependencies = [
    "pydantic>=2.6",
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
# LLM platform SDKs — only needed when the corresponding MCP adapter is used.
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.30"]
redis = ["redis>=5.0"]
all = ["anthropic>=0.40", "openai>=1.30", "redis>=5.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "black>=24.0",
]

[project.scripts]
luxor9 = "luxor9.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/luxor9"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# `str, Enum` is intentional for Pydantic/FastAPI value-serialization compatibility.
ignore = ["UP042"]

[tool.ruff.lint.flake8-bugbear]
# `Depends()`/`Query()` in argument defaults is the idiomatic FastAPI pattern.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.black]
line-length = 100
target-version = ["py311"]
