services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: luxor9
      POSTGRES_PASSWORD: luxor9
      POSTGRES_DB: luxor9
    ports:
      - "5432:5432"
    volumes:
      - luxor9_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luxor9 -d luxor9"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  luxor9_pg:
